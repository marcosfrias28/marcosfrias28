<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <title>Marcos Frias Banner</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#d2a8ff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="800" height="200" fill="url(#bg)"/>
  <rect width="800" height="200" fill="url(#dots)"/>

  <rect x="0" y="0" width="800" height="4" fill="url(#accent)"/>

  <rect x="40" y="30" width="2" height="140" rx="1" fill="#58a6ff" opacity="0.3"/>
  <rect x="758" y="30" width="2" height="140" rx="1" fill="#58a6ff" opacity="0.3"/>

  <circle cx="60" cy="40" r="3" fill="#58a6ff" opacity="0.2"/>
  <circle cx="80" cy="50" r="2" fill="#3fb950" opacity="0.2"/>
  <circle cx="740" cy="40" r="3" fill="#d2a8ff" opacity="0.2"/>
  <circle cx="720" cy="50" r="2" fill="#58a6ff" opacity="0.2"/>

  <circle cx="60" cy="160" r="2" fill="#3fb950" opacity="0.2"/>
  <circle cx="80" cy="150" r="3" fill="#58a6ff" opacity="0.2"/>
  <circle cx="740" cy="160" r="2" fill="#58a6ff" opacity="0.2"/>
  <circle cx="720" cy="150" r="3" fill="#d2a8ff" opacity="0.2"/>

  <rect x="0" y="110" width="800" height="90" fill="url(#glow)"/>

  <text x="400" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#f0f6fc" letter-spacing="-0.5">
    Marcos Frias
  </text>

  <rect x="310" y="110" width="180" height="3" rx="1.5" fill="url(#accent)"/>

  <text x="400" y="140" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#8b949e" letter-spacing="0.3">
    Fullstack Developer | Building web experiences
  </text>
</svg>
